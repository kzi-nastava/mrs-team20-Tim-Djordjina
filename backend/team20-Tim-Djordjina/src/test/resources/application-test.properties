# in memory database (H2 in PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Recreate the schema for each test run
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# JWT
jwt.secret=test-secret-key-for-jwt-integration-tests-change-me-please-0123456789-abcdefghijklmnop
jwt.expiration=86400000

# Dummy mail/config values so beans initialize without real credentials
spring.mail.host=localhost
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=dummy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
sendgrid.from.name=RideOn Test
app.base-url=http://localhost:8080
